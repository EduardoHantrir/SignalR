<body class="bg-gray-100">
    <main class="h-screen w-full flex justify-center items-center bg-gradient-to-b from-green-400 to-gray-100">
        <div class="h-full w-full md:w-[90%] lg:w-[80%] flex flex-col shadow-2xl bg-white">

            <!-- Header -->
            <header class="w-full flex py-3 px-4 items-center gap-3 bg-green-500 text-white shadow-md">
                <button class="hover:bg-green-600 p-2 rounded-full transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>

                <div class="h-10 w-10 rounded-full border-2 border-white overflow-hidden bg-white flex-shrink-0">
                    <img class="h-full w-full object-cover" alt="Foto do contato"
                        src="https://cdn-icons-png.flaticon.com/128/456/456212.png">
                </div>

                <div class="flex-1">
                    @if(user === "teste"){
                        <h1 class="text-base font-semibold">User</h1>
                    } @else {
                        <h1 class="text-base font-semibold">Teste</h1>
                    }
                    <p class="text-xs text-green-100">online</p>
                </div>
            </header>

            <!-- Chat Section -->
            <section class="flex-1 overflow-y-auto scrollbar-hide bg-gray-50 p-4 space-y-4"
                style="background-image: url('data:image/svg+xml,%3Csvg width=\'100\' height=\'100\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M0 0h100v100H0z\' fill=\'%23f0f2f5\'/%3E%3Cpath d=\'M20 20h60v60H20z\' fill=\'%23e9edef\' opacity=\'.05\'/%3E%3C/svg%3E');">
                @for (message of messages; track $index) {
                @if(message.sender == user) {
                <div class="flex items-end gap-2 justify-end">
                    <div class="chat-bubble-sent shadow-sm p-3 max-w-[70%]">
                        <p class="text-sm text-gray-800">{{message.text}}</p>
                        <span class="text-xs text-gray-600 block mt-1 text-right flex items-center justify-end gap-1">
                            00:00
                        </span>
                    </div>
                </div>
                }@else {
                <div class="flex items-end gap-2">
                    <div class="h-8 w-8 rounded-full overflow-hidden flex-shrink-0">
                        <img src="https://cdn-icons-png.flaticon.com/128/456/456212.png" alt="avatar"
                            class="h-full w-full object-cover">
                    </div>
                    <div class="chat-bubble-received shadow-sm p-3 max-w-[70%]">
                        <p class="text-sm text-gray-800">{{message.text}}</p>
                        <span class="text-xs text-gray-500 block mt-1 text-right">00:00</span>
                    </div>
                </div>
                }
                }
            </section>

            <!-- Footer -->
            <footer class="w-full bg-gray-100 p-3 border-t border-gray-200">
                <div class="flex items-center gap-2">

                    <div class="flex-1 relative">
                        <input type="text" placeholder="Digite uma mensagem"
                            class="w-full py-3 px-5 pr-10 rounded-full border border-gray-300 focus:outline-none focus:border-green-500 bg-white text-sm"
                            [value]="textControl.value" (input)="textControl.setValue($event.target.value)"
                            (keydown.enter)="sendMessage()">
                    </div>

                    <button class="bg-green-500 hover:bg-green-600 text-white p-3 rounded-full transition shadow-md" (click)="sendMessage()">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                        </svg>
                    </button>
                </div>
            </footer>

        </div>
    </main>
